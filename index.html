<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Trainer</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    color: #222;
}

.wrapper {
    width: 100%;
    max-width: 420px;
}

h2 {
    font-weight: 500;
    margin-bottom: 20px;
    font-size: 20px;
    color: #ff6f91;
}

.circle-btn {
    width: 28vw;
    height: 28vw;
    max-width: 130px;
    max-height: 130px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #ffc2d1, #ff8fab);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
    box-shadow: 0 10px 25px rgba(255, 143, 171, 0.3);
}

.circle-btn:active {
    transform: scale(0.95);
}

#result {
    margin-top: 25px;
    font-size: 22px;
    font-weight: 500;
    color: #ff6f91;
}

.meter {
    margin-top: 20px;
    height: 6px;
    background: #f3f3f3;
    border-radius: 20px;
    overflow: hidden;
}

.meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffc2d1, #ff8fab);
    transition: 0.1s linear;
}

canvas {
    margin-top: 25px;
    width: 100%;
    height: 90px;
}
</style>
</head>

<body>

<div class="wrapper">
    <h2>Voice Trainer</h2>
    <button class="circle-btn" onclick="start()">Start</button>
    <div id="result">Ready</div>
    <div class="meter">
        <div class="meter-fill" id="meterFill"></div>
    </div>
    <canvas id="graph"></canvas>
</div>

<script>
let audioContext, analyser, microphone, dataArray;
let canvas = document.getElementById("graph");
let ctx = canvas.getContext("2d");

canvas.width = 400;
canvas.height = 90;

const target = 440; // A4 note

async function start() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    microphone = audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);
    analyser.fftSize = 2048;

    dataArray = new Float32Array(analyser.fftSize);

    detectPitch();
}

function detectPitch() {
    analyser.getFloatTimeDomainData(dataArray);

    let pitch = autoCorrelate(dataArray, audioContext.sampleRate);

    drawGraph(dataArray);

    if (pitch !== -1) {
        document.getElementById("result").innerText =
            Math.round(pitch) + " Hz";

        let diff = Math.abs(pitch - target);
        let percent = Math.min(diff / 5, 100);
        document.getElementById("meterFill").style.width = percent + "%";
    }

    requestAnimationFrame(detectPitch);
}

function drawGraph(data) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
        let x = i * canvas.width / data.length;
        let y = (0.5 + data[i] / 2) * canvas.height;
        ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "#ff8fab";
    ctx.lineWidth = 2;
    ctx.stroke();
}

function autoCorrelate(buffer, sampleRate) {
    let SIZE = buffer.length;
    let rms = 0;

    for (let i = 0; i < SIZE; i++) {
        let val = buffer[i];
        rms += val * val;
    }

    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1;

    let bestOffset = -1;
    let bestCorrelation = 0;

    for (let offset = 8; offset < 1000; offset++) {
        let correlation = 0;

        for (let i = 0; i < SIZE - offset; i++) {
            correlation += buffer[i] * buffer[i + offset];
        }

        correlation = correlation / SIZE;

        if (correlation > bestCorrelation) {
            bestCorrelation = correlation;
            bestOffset = offset;
        }
    }

    if (bestCorrelation > 0.01) {
        return sampleRate / bestOffset;
    }

    return -1;
}
</script>

</body>
</html>
